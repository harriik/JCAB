events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'response_time: ${upstream_response_time}s';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream cluster with session affinity (ip_hash)
    # Critical for Streamlit's in-memory session state across WebSockets
    upstream adaptive_assessment_cluster {
        ip_hash;
        server app-1:8501 max_fails=3 fail_timeout=10s;
        server app-2:8501 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream single instance for baseline/single-instance routing
    upstream adaptive_assessment_single {
        server app-1:8501 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP Server (Port 80)
    server {
        listen 80;
        server_name localhost _;

        # Client body size limit for audio uploads
        client_max_body_size 50M;

        # Healthcheck endpoint for load balancer itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Proxy to Streamlit cluster
        location / {
            proxy_pass http://adaptive_assessment_cluster;
            proxy_http_version 1.1;

            # WebSocket upgrade headers - mandatory for Streamlit
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamlit WebSocket timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        # Dedicated Streamlit core healthcheck
        location /_stcore/health {
            proxy_pass http://adaptive_assessment_cluster/_stcore/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }

    # HTTPS Server (Port 443) - Required for Secure Context & Browser Microphone Permissions
    server {
        listen 443 ssl;
        server_name localhost _;

        # SSL Certificates (mounted from /etc/nginx/ssl)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 50M;

        location / {
            proxy_pass http://adaptive_assessment_cluster;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        location /_stcore/health {
            proxy_pass http://adaptive_assessment_cluster/_stcore/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
