services:
  # Primary Application Instance (Baseline & Cluster Node 1)
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-assessment-app-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INSTANCE_ID=app-1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - app_logs:/app/logs
      - app_validation:/app/research/validation
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - assessment_net

  # Secondary Application Instance (Cluster Node 2 for Load Balancing)
  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-assessment-app-2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INSTANCE_ID=app-2
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    ports:
      - "8502:8501"
    volumes:
      - app_logs:/app/logs
      - app_validation:/app/research/validation
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - assessment_net

  # Nginx Reverse Proxy & Load Balancer with WebSocket Affinity
  nginx:
    image: nginx:1.27-alpine
    container_name: adaptive-assessment-lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    networks:
      - assessment_net

volumes:
  app_logs:
    name: jcab_assessment_logs
  app_validation:
    name: jcab_assessment_validation
  nginx_logs:
    name: jcab_nginx_logs

networks:
  assessment_net:
    name: jcab_assessment_network
    driver: bridge
